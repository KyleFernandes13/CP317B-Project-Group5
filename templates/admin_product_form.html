
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{{ title }}</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}"
    >
</head>

<body>

    <header class="site-header">
        <div class="container header-content">

            <h1 class="logo">Group 5 Store</h1>

            <nav>
                <a href="{{ url_for('product_catalogue') }}">
                    Products
                </a>

                <a href="{{ url_for('admin_products') }}">
                    Manage Products
                </a>

                <a href="{{ url_for('admin_orders') }}">
                    Manage Orders
                </a>

                <a href="{{ url_for('logout') }}">
                    Logout
                </a>
            </nav>

        </div>
    </header>

    <main class="container">

        <section class="catalogue-header">

            <h2>{{ title }}</h2>

            <p>Enter the product information below.</p>

        </section>

        <section class="cart-panel">

            {% if error %}

                <div class="login-error" role="alert">
                    {{ error }}
                </div>

            {% endif %}

            <form method="post" class="login-form">

                <input
                    type="hidden"
                    name="csrf_token"
                    value="{{ csrf_token }}"
                >

                <label for="name">
                    Product Name
                </label>

                <input
                    type="text"
                    id="name"
                    name="name"
                    value="{{ product['name'] }}"
                    maxlength="100"
                    required
                >

                <label for="description">
                    Description
                </label>

                <textarea
                    id="description"
                    name="description"
                    rows="5"
                    maxlength="2000"
                    required
                >{{ product['description'] }}</textarea>

                <p></p>

                <label for="price">
                    Price ($)
                </label>

                <input
                    type="number"
                    id="price"
                    name="price"
                    min="0"
                    max="999999.99"
                    step="0.01"
                    value="{{ product['price'] }}"
                    required
                >

                <label for="image">
                    Image Filename (Optional)
                </label>

                <input
                    type="text"
                    id="image"
                    name="image"
                    value="{{ product['image'] or '' }}"
                    placeholder="example.jpg"
                >

                <p>
                    Image files must be located in static/images.
                    Leave this blank if no image is available.
                </p>

                <button type="submit" class="button">
                    Save Product
                </button>

            </form>

            <a
                class="back-link"
                href="{{ url_for('admin_products') }}"
            >
                &larr; Back to Manage Products
            </a>

        </section>

    </main>

</body>

</html>
